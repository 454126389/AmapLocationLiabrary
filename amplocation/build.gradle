apply plugin: 'com.android.library'
apply plugin: 'com.github.dcendents.android-maven'
group='454126389@qq.com'

android {
    compileSdkVersion 29
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 8
        versionName "1.1.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

}

dependencies {
    api fileTree(dir: 'libs', include: ['*.jar'])


    implementation 'androidx.appcompat:appcompat:1.2.0-alpha03'
    implementation 'androidx.annotation:annotation:1.0.0'
//    implementation files('libs\\AMap_Location_V5.2.0_20200915.jar')
//    compile files('libs/AMap_Location_V5.2.0_20200915.jar')

    //3D地图so及jar
    compile 'com.amap.api:3dmap:9.2.1'
    //定位功能
    compile 'com.amap.api:location:latest.integration'
    //搜索功能
    compile 'com.amap.api:search:latest.integration'

//    implementation 'com.amap.api:3dmap:latest.integration'

//    testImplementation 'junit:junit:4.12'
//    androidTestImplementation 'com.android.support.test:runner:1.0.2'
//    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
//    implementation(name: 'AMapLocation_4.2.0_20180810', ext: 'aar')

//    implementation 'com.amap.api:map2d:4.7.2'

}
